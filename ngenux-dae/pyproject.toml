[project]
name = "ngenux-dae"
version = "0.1.0"
description = "Ngenux DAE Production-grade workspace"
authors = [
    { name = "ARNAV" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "sqlalchemy>=2.0.20",
    "psycopg2-binary>=2.9.7",
    "alembic>=1.12.0",
    "streamlit>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
